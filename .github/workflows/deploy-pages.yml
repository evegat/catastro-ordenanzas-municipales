name: Deploy Dashboard to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install public-build dependency
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5

      - name: Build verified-only public snapshot
        run: |
          rm -rf .public-dashboard
          cp -a dashboard .public-dashboard
          python src/build_public_snapshot.py .public-dashboard

      - name: Verify public snapshot quarantine
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('.public-dashboard/status_data.json').read_text(encoding='utf-8'))
          ordinances = [
              o
              for c in data.get('comunas', [])
              for o in (c.get('ordenanzas') or [])
          ]
          cplt = [o for o in ordinances if o.get('fuente') == 'CPLT']
          assert not cplt, f'Public snapshot still contains {len(cplt)} CPLT records'
          assert data['metrics']['ordenanzas_cplt'] == 0
          assert data['metrics']['total_ordenanzas'] == len(ordinances)
          assert data['metrics']['ordenanzas_bcn'] == len(ordinances)
          print(f"Verified-only snapshot OK: {len(ordinances)} BCN records")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './.public-dashboard'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
