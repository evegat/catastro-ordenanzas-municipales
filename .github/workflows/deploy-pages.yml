name: Deploy Dashboard to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install public-build dependency
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5

      - name: Build verified-only public snapshot
        run: |
          rm -rf .public-dashboard
          cp -a dashboard .public-dashboard
          python src/build_public_snapshot.py .public-dashboard

      - name: Verify public snapshot evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('.public-dashboard/status_data.json').read_text(encoding='utf-8'))
          ordinances = [
              o
              for c in data.get('comunas', [])
              for o in (c.get('ordenanzas') or [])
          ]
          cplt = [o for o in ordinances if o.get('fuente') == 'CPLT']
          bcn = [o for o in ordinances if o.get('fuente') == 'BCN']
          municipal = [o for o in ordinances if o.get('fuente') == 'Municipalidad']
          assert not cplt, f'Public snapshot still contains {len(cplt)} unverified CPLT records'
          assert municipal, 'Verified municipal batch missing from public snapshot'
          for record in municipal:
              v = record.get('verification') or {}
              assert v.get('status') == 'verified'
              assert int(v.get('http_status') or 999) < 400
              assert len(v.get('sha256') or '') == 64
              assert int(v.get('bytes') or 0) > 0
              assert (record.get('target_url') or '').startswith('https://')

          metrics = data['metrics']
          assert metrics['ordenanzas_cplt'] == 0
          assert metrics['total_ordenanzas'] == len(ordinances)
          assert metrics['ordenanzas_bcn'] == len(bcn)
          assert metrics['ordenanzas_municipales_verificadas'] == len(municipal)
          print(
              f"Verified snapshot OK: {len(bcn)} BCN + "
              f"{len(municipal)} municipal verified"
          )
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './.public-dashboard'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
